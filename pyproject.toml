[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-studio"
version = "0.1.0"
description = "Native Linux control center for ASUS RGB peripherals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PySide6>=6.6"]

[project.scripts]
aura-studio = "aura_studio.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
aura_studio = ["qml/*.qml", "assets/*"]
