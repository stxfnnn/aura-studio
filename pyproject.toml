[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-studio"
version = "0.4.0"
description = "Open-source Armoury Crate alternative for Linux: per-key RGB and OLED control for ASUS ROG peripherals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PySide6>=6.6"]

[project.scripts]
aura-studio = "aura_studio.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
aura_studio = ["qml/*", "assets/*", "assets/sounds/*"]
